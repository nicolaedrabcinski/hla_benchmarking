[project]
name = "hla-benchmarking"
version = "0.1.0"
description = "Environment for scripts/notebooks/accuracy.ipynb: scoring, figures, and results tables for the HLA RNA-seq caller benchmark. Does NOT run the 12 HLA callers themselves -- see scripts/environments/ for their per-tool conda environments."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas==3.0.3",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "statsmodels==0.14.6",
    "matplotlib==3.10.9",
    "seaborn==0.13.2",
    "ipykernel==7.3.0",
    "nbconvert==7.17.1",
    "nbclient==0.11.0",
    "nbformat==5.10.4",
]

[tool.uv]
package = false
